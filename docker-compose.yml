name: fastapi_udemy

services:
  db:
    image: postgres:16-alpine
    container_name: fastapi_udemy_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no arquivo .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no arquivo .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Banco descartável para rodar os testes localmente.
  # Só sobe com: docker compose --profile test up -d --wait db_test
  # Os dados ficam em memória (tmpfs) e somem quando o container para.
  db_test:
    image: postgres:16-alpine
    container_name: fastapi_udemy_db_test
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: faculdade_fastapi_test
    ports:
      - "5434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faculdade_fastapi_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: